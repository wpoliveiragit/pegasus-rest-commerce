  description: Inovação e soluções inteligentes para um futuro melhor
  email: abc@pegasus.com
  phone: 55 11 9.9948-2323
  sac: 55 11 1234-5678

metadata.system:
  java-version: "@maven.compiler.release@"
  spring-boot-version: "@spring.boot.version@"
  build-tool: Maven
  pom:
    name: "@project.name@"
    description: "@project.description@"
    packaging: "@project.packaging@"
    groupId: "@project.groupId@"
    artifact: "@project.artifactId@"
    version: "@project.version@"

metadata.kafka:
  description: Criar uma descrição
  consumer:
    description: Criar uma descrição

metadata.database:
  - key: spring.datasource.url
    value: ${spring.datasource.url}
    content: |
      <dd>URL JDBC usada para conexão com o banco de dados</dd>
      <dd>jdbc:h2:mem:testdb: banco H2 em memória</dd>
      <dd>jdbc:h2:file:./datasource/database-h2: banco H2 persistido em arquivo</dd>
      <dd>jdbc:postgresql://host:5432/db: banco PostgreSQL</dd>

  - key: spring.datasource.driver-class-name
    value: ${spring.datasource.driver-class-name}
    content: |
      <dd>Classe do driver JDBC utilizado pelo datasource</dd>
      <dd>org.h2.Driver: driver JDBC do H2</dd>
      <dd>org.postgresql.Driver: driver JDBC do PostgreSQL</dd>
      <dd>com.mysql.cj.jdbc.Driver: driver JDBC do MySQL</dd>

  - key: spring.datasource.username
    value: ${spring.datasource.username}
    content: |
      <dd>Usuário utilizado para autenticação no banco de dados</dd>
      <dd>sa: usuário padrão do H2</dd>
      <dd>postgres: usuário padrão do PostgreSQL</dd>
      <dd>root: usuário comum em MySQL</dd>

  - key: spring.datasource.password
    value: ${spring.datasource.password}
    content: |
      <dd>Senha do usuário do banco de dados</dd>
      <dd>vazio: senha não definida</dd>
      <dd>variável de ambiente: senha externa ao código</dd>
      <dd>secret manager: senha gerenciada com segurança</dd>

  - key: spring.sql.init.mode
    value: ${spring.sql.init.mode}
    content: |
      <dd>Controla quando os scripts SQL são executados na inicialização</dd>
      <dd>always: executa sempre na inicialização</dd>
      <dd>embedded: executa apenas para bancos embarcados</dd>
      <dd>never: não executa scripts SQL</dd>

  - key: spring.sql.init.schema-locations
    value: ${spring.sql.init.schema-locations}
    content: |
      <dd>Localização dos scripts DDL executados na inicialização</dd>
      <dd>classpath:/scripts/audit-schema.sql: cria estruturas de auditoria</dd>
      <dd>classpath:/scripts/product-schema.sql: cria estruturas de produto</dd>

  - key: spring.sql.init.data-locations
    value: ${spring.sql.init.data-locations}
    content: |
      <dd>Localização dos scripts DML (carga inicial de dados)</dd>
      <dd>classpath:/scripts/data.sql: carga inicial de dados</dd>
      <dd>[]: nenhum script de dados</dd>

  - key: spring.jpa.show-sql
    value: ${spring.jpa.show-sql}
    content: |
      <dd>Define se o JPA exibirá as queries SQL no console</dd>
      <dd>true: exibe SQL no console</dd>
      <dd>false: não exibe SQL no console</dd>

  - key: spring.jpa.hibernate.ddl-auto
    value: ${spring.jpa.hibernate.ddl-auto}
    content: |
      <dd>Estratégia do Hibernate para criação/validação do schema</dd>
      <dd>none: nenhuma ação automática</dd>
      <dd>validate: valida o schema existente</dd>
      <dd>update: atualiza o schema automaticamente</dd>
      <dd>create: recria o schema ao iniciar</dd>
      <dd>create-drop: cria e remove o schema ao encerrar</dd>

  - key: hibernate.dialect
    value: ${hibernate.dialect}
    content: |
      <dd>Dialeto do banco usado pelo Hibernate</dd>
      <dd>org.hibernate.dialect.H2Dialect: dialeto do H2</dd>
      <dd>org.hibernate.dialect.PostgreSQLDialect: dialeto do PostgreSQL</dd>

  - key: spring.h2.console.enabled
    value: ${spring.h2.console.enabled}
    content: |
      <dd>Habilita o console web do H2</dd>
      <dd>true: console H2 habilitado</dd>
      <dd>false: console H2 desabilitado</dd>

  - key: spring.h2.console.path
    value: ${spring.h2.console.path}
    content: |
      <ddPath de acesso ao console web do H2</dd>
      <dd>/h2-console: endpoint do console H2</dd>

  - key: spring.h2.console.settings.web-allow-others
    value: ${spring.h2.console.settings.web-allow-others}
    content: |
      <ddPermite acesso ao console H2 a partir de outros hosts</dd>
      <dd>true: permite acesso remoto</dd>
      <dd>false: restringe acesso ao localhost</dd>

