# DATASOURCE CONFIGURATION COM H2
spring.datasource.url: 'jdbc:h2:file:./datasource/database-h2' # URL do banco de dados
spring.datasource.driver-class-name: org.h2.Driver # Driver do banco de dados H2
spring.datasource.username: sa # Usuário do banco de dados
spring.datasource.password: '' # Senha do banco de dados

spring.sql.init.mode: always # sempre executa os scripts SQL

# DDL: Data Definition Language. Manipulador de estruturas: CREATE TABLE, ALTER TABLE, CREATE INDEX, DROP
spring.sql.init.schema-locations:
  - classpath:/scripts/audit-schema.sql
  - classpath:/scripts/product-schema.sql

spring.sql.init.data-locations: [ ]

# JPA - Configurações de Persistência
spring.jpa.show-sql: false  # Exibe as consultas SQL geradas pelo JPA no console
spring.jpa.hibernate.ddl-auto: none  # Define o comportamento do Hibernate em relação ao esquema do banco (no caso, não faz nana)
hibernate.dialect: org.hibernate.dialect.H2Dialect  # Dialeto específico do H2 para o Hibernate (H2 não precisa)

# CONSOLE H2 - Acesso ao Console do H2 via Navegador
spring.h2.console.enabled: true  # Habilita o console do H2
spring.h2.console.path: /h2-console  # Define o caminho para acessar o console no navegador (ex: http://localhost:8080/h2-console)
spring.h2.console.settings.web-allow-others: true # Permite acessar o H2 Console a partir de outro host (não apenas localhost).
