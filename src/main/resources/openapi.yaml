        ╠════════════════════════════════════════════════════════════════════════════════════════════════
        <ul style="list-style-type: disc;">
          <li><b>200 Ok</b></li>
          <ul style="list-style-type: disc;">
            <li><b>200 Ok</b></li>
          </ul>
        </ul>
        - **200 Ok**
          - Retorno esperado 
        - **400 Bad-Request**
          - **page** não pode ser nulo, em branco ou negativo
