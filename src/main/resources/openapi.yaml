openapi: 3.0.0
info:
  version: 1.0.0
  title: API de Produtos
  #  title: PEGASUS-SA → API de Produtos
  termsOfService: http://localhost:8080/docs/terms.html
  contact: { name: Enterprise, email: suporte@pegasus.com.br, url: http://localhost:8080/pegasus/website.html }
  license: { name: License, url: http://localhost:8080/docs/license.html }
  description: |
    API de estudo para gerenciamento de produtos.  
    Contém operações de criação, consulta, atualização e exclusão de elementos do tipo produto.
    
    **NOTAS DO DESENVOLVEDOR**<br>
    
    **Links**<br>
    ● `Terms of service` → `resources/static/docs/terms.html`<br>
    ● `Website` → `resources/static/pegasus/website.html`<br>
    ● `License` → `resources/static/docs/terms.html`<br>
    ● `Database` → `http://localhost:8080/h2-console`<br>

servers:
  - url: http://localhost:8080
    description: Servidor local para solicitações de produtos

tags:
  - { name: product, description: produto }
  - { name: cooperator, description: cooperador }
  - { name: tax-receipt, description: cupom fiscal }
  - { name: tax-receipt-item, description: item do cupom fiscal }

paths:

  /cooperator:

    get:
      tags: [ cooperator ]
      operationId: cooperator-get-page
      parameters:
        - $ref: '#/components/parameters/_query_page'
        - $ref: '#/components/parameters/_query_size'
      summary: Busca uma paginação de elementos
      description: |
        Busca uma paginação de elementos.        
        
        **Notas do Desenvolvedor**
        ```
        ♢♢ HTTP STATUS ♢♢
        200: ok 
        400: bad request
        ● page/size: null - negativo
        500: Internal server erro
        ● erro ao executar uma query no banco de dado
        ● banco de dados off-line
        ```
      responses:
        '200':
          description: Retorna uma lista paginada de elementos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/cooperator-page-response-type' }
        "400": { $ref: '#/components/responses/bad-request-response' }
        "500": { $ref: '#/components/responses/internal-server-error-response' }

    post:
      tags: [ cooperator ]
      operationId: cooperator-create
      summary: Cria um novo elemento
      description: |
        Cria um novo elemento
        
        **Notas do Desenvolvedor**
        ```
        ● Documente number: campo único que representa o CPF
        ```
        ```
        ♢♢ HTTP STATUS ♢♢
        201: created
        400: bad request
        ● name: null - branco
        ● document number: null - branco - invalido.
        409: conflict
        ● document number já cadastrado
        500: Internal server erro
        ● erro ao executar uma query no banco de dado
        ● banco de dados off-line
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/cooperator-create-body-type' }
      responses:
        '201':
          description: Retorna o elemento criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/cooperator-type' }
        "400": { $ref: '#/components/responses/bad-request-response' }
        "409": { $ref: '#/components/responses/conflict-response' }
        "500": { $ref: '#/components/responses/internal-server-error-response' }

  /cooperator/{id}:
    parameters:
      - $ref: '#/components/parameters/_path_id'

    get:
      tags: [ cooperator ]
      operationId: cooperator-get-one
      summary: Busca um elemento pelo ID
      description: |
        Busca um elemento pelo ID
        
        **Notas do Desenvolvedor**
        ```
        ♢♢ HTTP STATUS ♢♢
        200: ok 
        404: not found
        500: Internal server erro
          ● erro ao executar uma query no banco de dado
          ● banco de dados off-line
        ```
      responses:
        '200':
          description: Retorna o elemento solicitado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/cooperator-type' }
        "404": { $ref: '#/components/responses/not-found-response' }
        "500": { $ref: '#/components/responses/internal-server-error-response' }

    put:
      tags: [ cooperator ]
      operationId: cooperator-update
      summary: Atualiza elemento pelo ID
      description: |
        Atualiza elemento pelo ID
        
        **Notas do Desenvolvedor**
        ```
        ♢♢ HTTP STATUS ♢♢
        204: no content
        400: bad request
          ● document number: invalido
        404: not found
        409: conflict
          ● document number já cadastrado
        500: Internal server erro
          ● erro ao executar uma query no banco de dado
          ● banco de dados off-line
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/cooperator-update-body-type' }
      responses:
        '204': { description: ok }
        "400": { $ref: '#/components/responses/bad-request-response' }
        "404": { $ref: '#/components/responses/not-found-response' }
        "409": { $ref: '#/components/responses/conflict-response' }
        "500": { $ref: '#/components/responses/internal-server-error-response' }

    delete:
      tags: [ cooperator ]
      operationId: cooperator-delete
      summary: Deleta um elemento pelo ID
      description: |
        Deleta um elemento pelo ID
        
        **Notas do Desenvolvedor**
        ```
        ♢♢ HTTP STATUS ♢♢
        204: no content
        404: not found
        500: Internal server erro
          ● erro ao executar uma query no banco de dado
          ● banco de dados off-line
        ```
      responses:
        '204': { description: ok }
        "404": { $ref: '#/components/responses/not-found-response' }
        "500": { $ref: '#/components/responses/internal-server-error-response' }

  /product:

    get:
      tags: [ product ]
      operationId: product-get-page
      parameters:
        - $ref: '#/components/parameters/_query_page'
        - $ref: '#/components/parameters/_query_size'
      summary: Busca uma paginação de elementos
      description: |
        Busca uma paginação de elementos
        
        **Notas do Desenvolvedor**
        ```mark
        ♢♢ HTTP STATUS ♢♢
        200: ok 
        400: bad request
          ● page/size: null - negativo
        500: Internal server erro
          ● erro ao executar uma query no banco de dado
          ● banco de dados off-line
        ```
      responses:
        '200':
          description: Retorna a paginação solicitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/product-page-response-type' }
        "400": { $ref: '#/components/responses/bad-request-response' }
        "500": { $ref: '#/components/responses/internal-server-error-response' }

    post:
      tags: [ product ]
      operationId: product-create
      summary: Cria um novo elemento
      description: |
        Cria um novo elemento
        
        **Notas do Desenvolvedor**
        ```
        ● name: campo único
        ```
        ```
        ♢♢ HTTP STATUS ♢♢
        201: created
        400: bad request
          ● name: nulo - branco
          ● price: nulo - negativo
          ● quantity: nulo - negativo
        409: conflict
          ● nome já cadastrado
        500: Internal server erro
          ● erro ao executar uma query no banco de dado
          ● banco de dados off-line
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/product-create-body-type' }
      responses:
        '201':
          description: Retorna o elemento criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/product-type' }
        "400": { $ref: '#/components/responses/bad-request-response' }
        "409": { $ref: '#/components/responses/conflict-response' }
        "500": { $ref: '#/components/responses/internal-server-error-response' }

  /product/{id}:
    parameters:
      - $ref: '#/components/parameters/_path_product_id'

    get:
      tags: [ product ]
      operationId: product-get-one
      summary: Busca um elemento pelo ID
      description: |
        Busca um elemento pelo ID
        
        **Notas do Desenvolvedor**
        ```
        ♢♢ HTTP STATUS ♢♢
        200: ok
        404: not found
        500: Internal server erro
          ● erro ao executar uma query no banco de dado
          ● banco de dados off-line
        ```
      responses:
        '200':
          description: O elemento correspondente ao ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/product-type' }
        "404": { $ref: '#/components/responses/not-found-response' }
        "500": { $ref: '#/components/responses/internal-server-error-response' }

    put:
      tags: [ product ]
      operationId: product-update
      summary: Atualiza um elemento pelo ID
      description: |
        Atualiza um elemento pelo ID
        
        **Notas do Desenvolvedor**
        ```
        ♢♢ HTTP STATUS ♢♢
        200: ok 
        400: bad request
          ● price: negativo
          ● quality: negativo
        404: not found
        409: conflict
          ● nome já cadastrado
        500: Internal server erro
          ● erro ao executar uma query no banco de dado
          ● banco de dados off-line
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/product-update-body-type' }
      responses:
        '200': { description: ok }
        "400": { $ref: '#/components/responses/bad-request-response' }
        "404": { $ref: '#/components/responses/not-found-response' }
        "409": { $ref: '#/components/responses/conflict-response' }
        "500": { $ref: '#/components/responses/internal-server-error-response' }

    delete:
      tags: [ product ]
      operationId: product-delete
      summary: Deleta um elemento pelo ID
      description: |
        Deleta um elemento pelo ID
        
        **Notas do Desenvolvedor**
        ```
        ♢♢ HTTP STATUS ♢♢
        204: no content
        404: not found
        500: Internal server erro
          ● erro ao executar uma query no banco de dado
          ● banco de dados off-line
        ```
      responses:
        '204': { description: ok }
        "404": { $ref: '#/components/responses/not-found-response' }
        "500": { $ref: '#/components/responses/internal-server-error-response' }

  /tax-receipt:

    get:
      tags: [ tax-receipt ]
      operationId: tax-receipt-get-page
      parameters:
        - $ref: '#/components/parameters/_query_page'
        - $ref: '#/components/parameters/_query_size'
      summary: Busca uma paginação de elementos
      description: |
        Busca uma paginação de elementos
        
        **Notas do Desenvolvedor**
        ```
        ♢♢ HTTP STATUS ♢♢
        200: ok 
        400: bad request
        ● page/size: null - branco
        500: Internal server erro
        ● erro ao executar uma query no banco de dado
        ● banco de dados off-line
        ```
      responses:
        '200':
          description: Retorna uma lista paginada de elementos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/tax-receipt-page-response-type' }
        "400": { $ref: '#/components/responses/bad-request-response' }
        "500": { $ref: '#/components/responses/internal-server-error-response' }

    post:
      tags: [ tax-receipt ]
      operationId: tax-receipt-create
      summary: Cria um novo elemento
      description: |
        Cria um novo elemento
        
        **Notas do Desenvolvedor**
        ```
        ♢♢ HTTP STATUS ♢♢
        201: created
        400: bad request
        ● cooperatorId: null, negativo
        500: Internal server erro
        ● erro ao executar uma query no banco de dado
        ● banco de dados off-line
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/tax-receipt-create-body-type' }
      responses:
        '201':
          description: Retorna o elemento criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/tax-receipt-type' }
        "400": { $ref: '#/components/responses/bad-request-response' }
        "500": { $ref: '#/components/responses/internal-server-error-response' }

  /tax-receipt/{id}:
    parameters:
      - $ref: '#/components/parameters/_path_id'

    get:
      tags: [ tax-receipt ]
      operationId: tax-receipt-get-one
      summary: Busca um elemento pelo ID
      description: |
        Busca um elemento pelo ID
        
        **Notas do Desenvolvedor**
        ```
        ♢♢ HTTP STATUS ♢♢
        200: ok 
        404: not found
        500: Internal server erro
        ● erro ao executar uma query no banco de dado
        ● banco de dados off-line
        ```
      responses:
        '200':
          description: O elemento correspondente ao ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/tax-receipt-type' }
        "404": { $ref: '#/components/responses/not-found-response' }
