        ```text
        NOTAS DO DESENVOLVEDOR
        ╔════════════════════════════════════════════════════════════════════════════════════════════════
        ║ →●                                                                                             ║
        ♢♢ HTTP STATUS ♢♢
        ╠════════════════════════════════════════════════════════════════════════════════════════════════
        200: ok 
        400: bad request
        ● page/size: null - negativo
        500: Internal server erro
        ● erro ao executar uma query no banco de dado
        ● banco de dados off-line
        ╚════════════════════════════════════════════════════════════════════════════════════════════════
        ```
      responses:
        '200':
          description: Retorna a paginação solicitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/tax-receipt-item-page-response-type' }
        "404": { $ref: '#/components/responses/not-found-response' }
        "500": { $ref: '#/components/responses/internal-server-error-response' }

components:
  schemas:
    # [ GERAL ]
    att-id: { type: integer, example: 1000 , description: 'Identificador do elemento' }

    # [EXCEPTION]
    att-i-code: { type: integer, example: 'mensagem do tipo do erro', description: 'detalhes do erro' }
    att-s-message: { type: string, example: 'mensagem do tipo do erro', description: 'detalhes do erro' }
    att-s-message-detail: { type: string, example: 'mensagem', description: 'mensagem' }

    att-page: { type: integer, example: 10, description: Página atual (0-based) }
    att-size: { type: integer, example: 30, description: Tamanho da página }
    att-pages: { type: integer, example: 10, description: Total de páginas (com base no size) }
    att-previous: { type: boolean, example: true, description: Se há página anterior }
    att-next: { type: boolean, example: true, description: Se há página posterior }
    att-elements: { type: integer, format: int64, example: 300, description: Total de registros }
    att-name: { type: string, example: 'Wellington', description: Nome do elemento }
    att-s-product-name: { type: string, example: 'Chocolate', description: Nome do produto }
    att-document-number: { type: string, example: '33344455512', description: Nome do cooperador }
    att-price: { type: number, format: float, example: '3.52', description: preço do elemento }
    att-quantity: { type: integer, example: 10, description: quantidade de elementos }

    att-date: { type: string, format: date-time, example: 12, description: data do registro }

    pagination-type:
      type: object
      properties:
        page: { $ref: '#/components/schemas/att-page' }
        size: { $ref: '#/components/schemas/att-size' }
        elements: { $ref: '#/components/schemas/att-elements' }
        pages: { $ref: '#/components/schemas/att-pages' }
        previous: { $ref: '#/components/schemas/att-previous' }
        next: { $ref: '#/components/schemas/att-next' }

    exception-type:
      type: object
      properties:
        code: { $ref: '#/components/schemas/att-i-code' }
        message: { $ref: '#/components/schemas/att-s-message' }
        messageDetail: { $ref: '#/components/schemas/att-s-message-detail' }

    # [ COOPERATOR ]
    cooperator-type:
      type: object
      properties:
        id: { $ref: '#/components/schemas/att-id' }
        name: { $ref: '#/components/schemas/att-name' }
        documentNumber: { $ref: '#/components/schemas/att-document-number' }

    cooperator-page-response-type:
      type: object
      properties:
        pagination: { $ref: '#/components/schemas/pagination-type' }
        data:
          type: array
          items: { $ref: '#/components/schemas/cooperator-type' }

    cooperator-create-body-type:
      type: object
      properties:
        name: { $ref: '#/components/schemas/att-name' }
        documentNumber: { $ref: '#/components/schemas/att-document-number' }
      required: [ name, documentNumber ]

    cooperator-update-body-type:
      type: object
      properties:
        name: { $ref: '#/components/schemas/att-name' }
        documentNumber: { $ref: '#/components/schemas/att-document-number' }

    # [ PROCUCT ]
    product-type:
      type: object
      properties:
        id: { $ref: '#/components/schemas/att-id' }
        name: { $ref: '#/components/schemas/att-s-product-name' }
        price: { $ref: '#/components/schemas/att-price' }
        quantity: { $ref: '#/components/schemas/att-quantity' }

    product-page-response-type:
      type: object
      properties:
        pagination: { $ref: '#/components/schemas/pagination-type' }
        data:
          type: array
          items: { $ref: '#/components/schemas/product-type' }

    product-create-body-type:
      type: object
      properties:
        name: { $ref: '#/components/schemas/att-s-product-name' }
        price: { $ref: '#/components/schemas/att-price' }
        quantity: { $ref: '#/components/schemas/att-quantity' }

    product-update-body-type:
      type: object
      properties:
        name: { $ref: '#/components/schemas/att-s-product-name' }
        price: { $ref: '#/components/schemas/att-price' }
        quantity: { $ref: '#/components/schemas/att-quantity' }

    # [ TAX-RECEIPT ]
    tax-receipt-type:
      type: object
      properties:
        id: { $ref: '#/components/schemas/att-id' }
        cooperator-id: { $ref: '#/components/schemas/att-id' }
        date: { $ref: '#/components/schemas/att-date' }

    tax-receipt-page-response-type:
      type: object
      properties:
        pagination: { $ref: '#/components/schemas/pagination-type' }
        data:
          type: array
          items: { $ref: '#/components/schemas/tax-receipt-type' }

    tax-receipt-create-body-type:
      type: object
      properties:
        cooperator-id: { $ref: '#/components/schemas/att-id' }

    # [ TAX-RECEIPT-ITEM ]
    tax-receipt-item-type:
      type: object
      properties:
        taxReceipt-id: { $ref: '#/components/schemas/att-id' }
        product-id: { $ref: '#/components/schemas/att-id' }
        quantity: { $ref: '#/components/schemas/att-quantity' }

    tax-receipt-item-page-response-type:
      type: object
      properties:
        pagination: { $ref: '#/components/schemas/pagination-type' }
        data:
          type: array
          items: { $ref: '#/components/schemas/tax-receipt-item-type' }

    tax-receipt-item-create-body-type:
      type: object
      properties:
        taxReceipt-id: { $ref: '#/components/schemas/att-id' }
        product-id: { $ref: '#/components/schemas/att-id' }
        quantity: { $ref: '#/components/schemas/att-quantity' }

    # [ Exception ]
    exception-response-type:
      type: object
      description: Modelo padrão para exceptions
      properties:
        code: { $ref: '#/components/schemas/att-i-code' }
        message: { $ref: '#/components/schemas/att-s-message' }
        messageDetail: { $ref: '#/components/schemas/att-s-message-detail' }

  responses:

    bad-request-response:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/exception-response-type'
          example:
            - code: 400
              message: Bad Request
              messageDetail: Invalid ParameterX

    not-found-response:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/exception-response-type'
          example:
            - code: 404
              message: Not Found
              messageDetail: Element not found

    conflict-response:
      description: Elemento já Cadastrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/exception-response-type'
          example:
            - code: 409
              message: Conflict
              messageDetail: Element already registered

    internal-server-error-response:
      description: Erro interno no servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/exception-response-type'
          example:
            - code: 500
              message: Internal Server Error
              messageDetail: PROBLEMS IN QUERYING THE DATABASE

  parameters:
    _header_x_request_id:
      name: X-Request-Id
      in: header
      description: >
        Identificador único da requisição.  
        Deve ser o mesmo em todas as chamadas do fluxo para permitir rastreabilidade entre sistemas.  
        Caso não informado, o servidor pode gerar automaticamente um novo identificador.
      required: true
      schema:
        type: string
        format: uuid
        example: "a12f3cde-45b6-7890-abc1-def234567890"

    _query_page:
      description: não pode ser nulo | negativo | branco.
      in: query
      name: page
      schema:
        type: integer
        example: 0

    _query_size:
      description: não pode ser nulo | negativo | branco.
      in: query
      name: size
      schema:
        type: integer
        example: 10

    _path_id:
      description: não pode ser nulo | negativo | branco.
      in: path
      name: id
      required: true
      schema:
        type: integer

    _path_product_id:
      description: não pode ser nulo | negativo | branco.
      in: path
      name: productId
      required: true
      schema:
        type: integer

    _path_tax_receipt_id:
      description: não pode ser nulo | negativo | branco.
      in: path
      name: taxReceiptId
      required: true
      schema:
        type: integer
