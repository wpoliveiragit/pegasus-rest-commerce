      - $ref: '#/components/parameters/_path_tax_receipt_id'
      - $ref: '#/components/parameters/_path_product_id'

    get:
      tags: [ tax-receipt-item ]
      operationId: tax-receipt-item-get-one
      summary: Busca um elemento pelo ID
